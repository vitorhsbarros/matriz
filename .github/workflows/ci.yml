# Continuous integration: the tests, static analysis of the code (SAST) and of the dependencies (SCA),
# then the container image, built, scanned and tested only once all of those have passed.
# Any failing test or any finding fails the workflow. Deployment (CD) is not part of it yet (PD13).
#
# Actions are pinned to the commit of a release at least two weeks old; the version is in the comment.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # The end-to-end test's browser needs system libraries the runner may lack; the version matches
      # frontend/package.json. The build itself installs Node, the npm packages and Chromium.
      - name: Install the browser's system libraries
        run: npx --yes playwright@1.64.1 install-deps chromium

      # The same command as on a developer's machine (README.md): back-end tests against PostgreSQL in
      # Testcontainers, the browser application's tests, ModularityTest and the end-to-end test.
      - name: Build and run every test
        run: ./mvnw --batch-mode verify

      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14

  sast-semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.183.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The rule sets of the code and security review (docs/quality-security-review.md).
      - name: Scan the code
        run: >-
          semgrep scan --metrics=off --error
          --config p/java --config p/security-audit --config p/typescript --config p/react
          --config p/secrets --config p/owasp-top-ten
          src frontend/src frontend/e2e frontend/playwright.config.ts frontend/vite.config.ts
          compose.yaml .env.example

  sast-codeql:
    name: SAST (CodeQL, ${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
          output: codeql-results

      # The analysis publishes its alerts to code scanning but doesn't fail on them; this step does.
      - name: Fail on any alert
        run: |
          alerts=$(jq '[.runs[].results[]] | length' codeql-results/*.sarif)
          echo "CodeQL alerts: $alerts"
          jq -r '.runs[].results[] | "\(.ruleId): \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)"' codeql-results/*.sarif
          test "$alerts" -eq 0

  sca:
    name: SCA (OSV-Scanner)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # OSV-Scanner can't read the versions in pom.xml, which come from Spring Boot's parent, so Maven
      # writes a CycloneDX SBOM of the resolved dependencies (every scope, test included). The plugin is
      # called here only; it isn't part of the build in pom.xml.
      - name: Write the SBOM of the Maven dependencies
        run: |
          ./mvnw --batch-mode --quiet org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeBom \
            -DoutputFormat=json -DoutputName=bom -DincludeTestScope=true
          components=$(jq '.components | length' target/bom.json)
          echo "Maven dependencies in the SBOM: $components"
          test "$components" -gt 0

      - name: Scan the dependencies
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=target/bom.json
            --lockfile=frontend/package-lock.json

  # The application image (Dockerfile), built only after every check above has passed. It is scanned
  # for known vulnerabilities and tested with Docker Compose, then thrown away: nothing is published.
  image:
    name: Image (build, scan and smoke test)
    needs: [build, sast-semgrep, sast-codeql, sca]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The image's layers are cached in GitHub Actions' cache between runs.
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          tags: matriz:local
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The same OSV-Scanner as the sca job (the image its action runs, pinned by digest), here over the
      # image's operating system packages. It fails only on vulnerabilities that already have a fix,
      # which a newer base image or package update would remove; the others are listed.
      - name: Scan the image
        run: |
          docker save matriz:local --output "$RUNNER_TEMP/image.tar"
          code=0
          docker run --rm --volume "$RUNNER_TEMP:/scan" --entrypoint osv-scanner \
            ghcr.io/google/osv-scanner-action:v2.7.0@sha256:d54770fe0b09493894e76a02aaed9f51a0513fa57c5186452a755d257b0068a6 \
            scan image --archive /scan/image.tar --format json --output-file /scan/osv-image.json \
            > "$RUNNER_TEMP/osv.log" 2>&1 || code=$?
          # 0: nothing found; 1: vulnerabilities found. Anything else means the scan itself failed.
          if [ "$code" -gt 1 ]; then cat "$RUNNER_TEMP/osv.log"; exit "$code"; fi
          # One row per advisory and package, with the fixed version for the package's own release.
          jq '[ .results[]?.packages[] as $p | $p.groups[] as $g
                | [ $p.vulnerabilities[] | select(.id as $id | $g.ids | index($id)) | .affected[]?
                    | select(.package.name == $p.package.name
                             and ((.package.ecosystem // "") | startswith($p.package.ecosystem)))
                    | .ranges[]?.events[]? | .fixed // empty ] as $fixes
                | { id: $g.ids[0], package: ($p.package.os_package_name // $p.package.name),
                    version: $p.package.version, severity: ($g.max_severity // "-"),
                    fixed: ($fixes | unique | join(", ")) } ]' \
            "$RUNNER_TEMP/osv-image.json" > "$RUNNER_TEMP/rows.json"
          fixable=$(jq '[.[] | select(.fixed != "")] | length' "$RUNNER_TEMP/rows.json")
          unfixed=$(jq '[.[] | select(.fixed == "")] | length' "$RUNNER_TEMP/rows.json")
          {
            echo "### Image scan (OSV-Scanner)"
            echo
            echo "Vulnerabilities with a fix: **$fixable**. Without a fix yet: $unfixed."
            echo
            echo "| Advisory | Package | Version | Severity | Fixed in |"
            echo "|---|---|---|---|---|"
            jq -r 'sort_by(.fixed == "") | .[]
                   | "| \(.id) | \(.package) | \(.version) | \(.severity) | \(if .fixed == "" then "no fix yet" else .fixed end) |"' \
              "$RUNNER_TEMP/rows.json"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Vulnerabilities with a fix: $fixable. Without a fix yet: $unfixed."
          jq -r '.[] | "\(if .fixed == "" then "no fix  " else "FIXABLE " end) \(.id) \(.package) \(.version) (severity \(.severity))\(if .fixed == "" then "" else ", fixed in \(.fixed)" end)"' \
            "$RUNNER_TEMP/rows.json" | sort
          test "$fixable" -eq 0

      # The runner has no .env, so one is written with throw-away values made here, masked so that
      # they never show in the log. It is deleted at the end of the job.
      - name: Write a throw-away configuration
        run: |
          umask 077
          db=$(openssl rand -hex 24); ana=$(openssl rand -hex 24)
          rui=$(openssl rand -hex 24); sara=$(openssl rand -hex 24)
          for value in "$db" "$ana" "$rui" "$sara"; do echo "::add-mask::$value"; done
          {
            echo "MATRIZ_DB_NAME=matriz"
            echo "MATRIZ_DB_USER=matriz"
            echo "MATRIZ_DB_PASSWORD=$db"
            echo "MATRIZ_DEMO_SEED=true"
            echo "MATRIZ_DEMO_PASSWORD_ANA=$ana"
            echo "MATRIZ_DEMO_PASSWORD_RUI=$rui"
            echo "MATRIZ_DEMO_PASSWORD_SARA=$sara"
            # The smoke test uses plain HTTP on localhost.
            echo "MATRIZ_COOKIE_SECURE=false"
          } > .env

      - name: Start the application with Docker Compose
        run: docker compose --profile app up --detach --wait --no-build

      # The image, the application and data persistence (scripts/image-smoke-test.sh).
      - name: Smoke test
        run: scripts/image-smoke-test.sh

      - name: Show the containers' logs
        if: failure()
        run: docker compose --profile app logs --no-color || true

      - name: Remove the containers, the data and the configuration
        if: always()
        run: |
          docker compose --profile app down --volumes || true
          rm -f .env
